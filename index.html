<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3cb0ff">
<title>Age of War</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<div id="app">
  <div id="bar" role="toolbar" aria-label="Display">
    <span class="title">Age of War</span>
    <span class="grow"></span>
    <button type="button" id="z-out" title="Zoom out (-)" aria-label="Zoom out">−</button>
    <output id="z-label" aria-live="polite">Fit</output>
    <button type="button" id="z-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
    <button type="button" id="z-fit" title="Fit to window (0)">Fit</button>
    <button type="button" id="fs" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  </div>
  <div id="stage"><iframe id="game" src="game.html" title="Age of War" allow="autoplay; fullscreen"></iframe></div>
</div>
<noscript><p style="color:#fff;padding:1em">Age of War needs JavaScript.</p></noscript>
<script src="js/shell.js"></script>
</body>
</html>
